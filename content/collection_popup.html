<!doctype html>
<html>
<head>
    <title>Shirabeyou</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../styles/styles.css">
    <link rel="stylesheet" href="../styles/collection_popup.css">
    <script src="../shared/constants.js" defer></script>
    <script src="../shared/styles.js" defer></script>
    <script src="../lib/wanakana.min.js" defer></script>
    <script src="../shared/db.js" defer></script>
    <script src="../shared/api.js" defer></script>
    <script src="../shared/helpers_render.js" defer></script>
    <script src="../shared/window_manager.js" defer></script>
    <script src="collection_popup.js" defer></script>
</head>
<body id="main-body" class="theme-default" style="background: var(--bg-idle-01);">
    <div class="collection-main-body">

        <!--- TAB BAR-------------------------------------------->
        <div id="tab-bar" style="
            display: flex;
            flex-direction: row;
            padding: 0px;
        ">
            <button id="btn-tab-collection" class="btn-tab-active" data-tab="collection">
                Collection
            </button>
            <button id="btn-tab-account" class="btn-tab" data-tab="account">
                Account
            </button>
            <button id="btn-tab-settings" class="btn-tab" data-tab="settings">
                Settings
            </button>

        </div>

        <!--- TAB: COLLECTION------------------------------------>
        <div id="tab-collection" class="tab-panel">
            <!--- HEADER -->
            <div id="header" class="collection-header"> 
                <div class="collection-header-container">
                    <h3 class="title-text-gradient" style="
                               margin: 0px;
                               padding-bottom: 8px;">
                        Saved kanji
                    </h3>
                    <div style="display: flex; 
                                justify-content: center; 
                                ">
                        <div style="font-size: 1.12rem; margin: 0px;">
                            <b id="collection-db-size" class="collection-db-size-text"></b>
                            <b style="color: var(--text-default-color);"> saved</b>
                        </div>
                    </div>
                </div>
            </div>

            <!--- MIDDLE SECTION (kanji grid) -->
            <div id="middle" 
                style="border-bottom: 1px solid var(--border-box)">
                <div id="kanji-grid" class="collection-kanji-grid"></div>
            </div>

            <!--- FOOTER -->
            <div id="footer">
                <div class="collection-footer">
                    <input class="box-search-01"
                            style="flex: 1; min-width: 0;"
                            id="collection-footer-searchbox"
                            type="text"
                            placeholder="Search for Kanji...">
                    <button class="btn-01" id="sort-old">
                        <span>Sort by date</span>
                    </button>
                    <button class="btn-01" id="sort-jlpt">
                        <span>Sort by level</span>
                    </button>
                </div>
            </div>
        </div>

        <!--- TAB: ACCOUNT--------------------------------------->
        <div id="tab-account" class="tab-panel" style="display: none">

            <!-- Logged Out ---->
            <div id="account-screen-login" class="tab-screen" style="display: none;">
                <div class="tab-account-container box-01">
                    <input id="login-email" class="box-search-01" type="email" placeholder="Email">
                    <input id="login-password" class="box-search-01" type="password" placeholder="Password">

                    <!--Hidden display for auth errors. Content to be set through script-->
                    <p id="login-auth-error" class="text-error"></p>
                    <!-------------------------------------------------------------------->

                    <button id="login-btn-login" class="btn-00" style="width: 100%; margin-top: 16px;">
                        Log In
                    </button>
                    <button id="login-btn-register" class="btn-00" style="width: 100%">
                        Register
                    </button>
                </div>
            </div>

            <!-- Logged In ---->
            <div id="account-screen-main" class="tab-screen" style="display: none;">
                <div class="tab-account-container box-01">
                    <button id="account-btn-logout" class="btn-01" style="width: 100%">
                        Log Out
                    </button>
                    <button id="account-btn-change-pass" class="btn-01" style="width: 100%">
                        Change Password
                    </button>
                    <button id="account-btn-delete" class="btn-02" style="width: 100%">
                        Delete Account
                    </button>
                </div>
            </div>

            <!-- Change Password --->
            <div id="account-screen-change-pass" class="tab-screen" style="display: none">
                <div class="tab-account-container box-01">
                    
                    <h3>Change Password</h3>
                    <input id="change-pass-current" class="box-search-01" type="password" placeholder="Current Password">
                    <input id="change-pass-new" class="box-search-01" type="password" placeholder="New Password">
                    <input id="change-pass-confirm" class="box-search-01" type="password" placeholder="Confirm new Password">
                    
                    <!--Error message - hidden by default-->
                    <p id="change-pass-error" class="text-error" style="display: none"></p>

                    <button id="change-pass-submit-btn" class="btn-00" style="width: 100%;">
                        Change Password
                    </button>
                    <button id="change-pass-back-btn" class="btn-01" style="width: 100%;">
                        Back
                    </button>
                </div>
            </div>

            <!-- Delete Account --->
            <div id="account-screen-delete" class="tab-screen" style="display: none;">
                <div class="tab-account-container box-01">
                    <p style="margin: 0; color var(--text-default-color);">
                        This will permanently delete your account and all saved Kanji. This action cannot be undone.
                    </p>
                    
                    <!--Error message - hidden by default-->
                    <p id="delete-error" class="text-error" style="display: none"></p>

                    <button id="delete-confirm-btn" class="btn-00" style="width: 100%">
                        Confirm Delete
                    </button>
                    <button id="delete-back-btn" class="btn-01" style="width: 100%">
                        Back
                    </Button>
                </div>
            </div>

        </div>
        <!--- TAB: SETTINGS-------------------------------------->
        <div id="tab-settings" class="tab-panel" style="display: none">
            <div id="settings-screen-main" class="tab-screen">

                <div id="settings-content" class="box-01">
                    <!-- Palette switcher --->
                    <div class="settings-item">
                        <h3>Color Palette</h3>
                        <div style="display: flex; gap: 8px;">
                            <button id="palette-dark" class="btn-02">Dark</button>
                            <button id="palette-light" class="btn-02">Light</button>
                        </div>
                    </div>
                </div>

            </div>
        </div>

    </div>
</body>
</html>
