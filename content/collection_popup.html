<!doctype html>
<html>
<head>
    <title>Shirabeyou</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../styles/styles.css">
    <link rel="stylesheet" href="../styles/collection_popup.css">
    <script src="../lib/wanakana.min.js"></script>
    <script type="module" src="collection_popup.js"></script>
</head>
<body id="main-body" class="theme-default" style="background: var(--bg-idle-01);">
    <div class="collection-main-body">

        <!--- TAB BAR-------------------------------------------->
        <div id="tab-bar" style="
            display: flex;
            flex-direction: row;
            padding: 0px;
        ">
            <button id="btn-tab-collection" class="btn-tab-active" data-tab="collection">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-book-marked-icon lucide-book-marked"><path d="M10 2v8l3-3 3 3V2"/><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/></svg>
            </button>
            <button id="btn-tab-practice" class="btn-tab" data-tab="practice">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-brain-icon lucide-brain"><path d="M12 18V5"/><path d="M15 13a4.17 4.17 0 0 1-3-4 4.17 4.17 0 0 1-3 4"/><path d="M17.598 6.5A3 3 0 1 0 12 5a3 3 0 1 0-5.598 1.5"/><path d="M17.997 5.125a4 4 0 0 1 2.526 5.77"/><path d="M18 18a4 4 0 0 0 2-7.464"/><path d="M19.967 17.483A4 4 0 1 1 12 18a4 4 0 1 1-7.967-.517"/><path d="M6 18a4 4 0 0 1-2-7.464"/><path d="M6.003 5.125a4 4 0 0 0-2.526 5.77"/></svg>
            </button>
            <button id="btn-tab-account" class="btn-tab" data-tab="account">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-circle-user-round-icon lucide-circle-user-round"><path d="M17.925 20.056a6 6 0 0 0-11.851.001"/><circle cx="12" cy="11" r="4"/><circle cx="12" cy="12" r="10"/></svg>
            </button>
            <button id="btn-tab-settings" class="btn-tab" data-tab="settings">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-settings-icon lucide-settings"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>
            </button>

        </div>

        <!--- TAB: COLLECTION------------------------------------>
        <div id="tab-collection" class="tab-panel">
            <!--- HEADER -->
            <div id="header" class="collection-header"> 
                <div class="collection-header-container">
                    <h3 class="title-text-gradient" style="
                               margin: 0px;
                               padding-bottom: 8px;">
                        Saved kanji
                    </h3>
                    <div style="display: flex; 
                                justify-content: center; 
                                ">
                        <div style="font-size: 1.12rem; margin: 0px;">
                            <b id="collection-db-size" class="collection-db-size-text"></b>
                            <b style="color: var(--text-default-color);"> saved</b>
                        </div>
                    </div>
                </div>
            </div>

            <!--- MIDDLE SECTION (kanji grid) -->
            <div id="middle" style="border-bottom: 1px solid var(--border-box)">
                <div id="kanji-grid" class="collection-kanji-grid"></div>
            </div>

            <!--- FOOTER -->
            <div id="footer">
                <div class="collection-footer">
                    <input class="box-search-01"
                            style="flex: 1; min-width: 0;"
                            id="collection-footer-searchbox"
                            type="text"
                            placeholder="Search for Kanji...">
                    <button class="btn-01" id="sort-old">
                        <span>Sort by date</span>
                    </button>
                    <button class="btn-01" id="sort-jlpt">
                        <span>Sort by level</span>
                    </button>
                </div>
            </div>
        </div>

        <!--- TAB: PRACTICE-------------------------------------->
        <div id="tab-practice" class="tab-panel" style="display: none;">
            
            <!-- Question Screen ---->
            <div id="practice-question-screen" class="practice-screen" style="display: none">
                <div class="practice-prompt-box box-01">
                    <b id="practice-question-prompt">Prompt</b>
                    <b id="practice-question-kanji">調</b>
                </div>
                <div id="practice-question-answer-row">
                    <input class="box-search-01"
                           style="flex: 4; min-width: 0;"
                           id="practice-question-input"
                           type="text"
                           placeholder="This should be set dynamically">
                    <button id="practice-question-btn" class="btn-00" style="flex: 1">
                        Check
                    </button>
                </div>
            </div>

            <!-- Feedback Screen ---->
            <div id="practice-feedback-screen" class="practice-screen" style="display: none">
                <div id="practice-feedback-correct">
                    <b>Placeholder</b>
                </div>
                <div class="practice-prompt-box box-01">
                    <b id="practice-feedback-kanji" style="margin: 0px">調</b>
                    <div id="practice-feedback-feedback">
                        <b style="color: var(--text-muted);">Also accepted:</b>
                        <b id="practice-feedback-accepted">placeholder, placeholder, placeholder</b>
                    </div>
                    <button id="practice-feedback-btn" class="btn-01" style="
                        margin: 16px;
                        margin-bottom: 32;
                        align-self: stretch;
                    ">
                        Next
                    </button>
                </div>
            </div>

            <!-- Message Screen ---->
            <div id="practice-message-screen" class="practice-screen" style="display: flex">
                <b id="practice-message-title">This is a placeholder</b>
                <b id="practice-message-subtitle">This is a placeholder</b>
            </div>

        </div>

        <!--- TAB: ACCOUNT--------------------------------------->
        <div id="tab-account" class="tab-panel" style="display: none">

            <!-- Logged Out ---->
            <div id="account-screen-login" class="tab-screen" style="display: none;">
                <h2>Log In</h2>
                <div class="tab-account-container box-01">
                    <input id="login-username" class="box-search-01" type="text" placeholder="Username">
                    <input id="login-password" class="box-search-01" type="password" placeholder="Password">

                    <!--Hidden display for auth errors. Content to be set through script-->
                    <p id="login-auth-error" class="text-error"></p>
                    <!-------------------------------------------------------------------->

                    <button id="login-btn-login" class="btn-00" style="width: 100%; margin-top: 16px;">
                        Log In
                    </button>
                    <button id="login-btn-register" class="btn-00" style="width: 100%">
                        Register
                    </button>
                </div>
            </div>

            <!-- Logged In ---->
            <div id="account-screen-main" class="tab-screen" style="display: none;">
                <h2>Account</h2>
                <div class="tab-account-container box-01">
                    <button id="account-btn-logout" class="btn-01" style="width: 100%">
                        Log Out
                    </button>
                    <button id="account-btn-change-pass" class="btn-01" style="width: 100%">
                        Change Password
                    </button>
                    <button id="account-btn-delete" class="btn-02" style="width: 100%">
                        Delete Account
                    </button>
                </div>
            </div>

            <!-- Change Password --->
            <div id="account-screen-change-pass" class="tab-screen" style="display: none">
                <div class="tab-account-container box-01">
                    
                    <h3>Change Password</h3>
                    <input id="change-pass-current" class="box-search-01" type="password" placeholder="Current Password">
                    <input id="change-pass-new" class="box-search-01" type="password" placeholder="New Password">
                    <input id="change-pass-confirm" class="box-search-01" type="password" placeholder="Confirm new Password">
                    
                    <!--Error message - hidden by default-->
                    <p id="change-pass-error" class="text-error" style="display: none"></p>

                    <button id="change-pass-submit-btn" class="btn-00" style="width: 100%;">
                        Change Password
                    </button>
                    <button id="change-pass-back-btn" class="btn-01" style="width: 100%;">
                        Back
                    </button>
                </div>
            </div>

            <!-- Delete Account --->
            <div id="account-screen-delete" class="tab-screen" style="display: none;">
                <div class="tab-account-container box-01">
                    <p style="margin: 0; color var(--text-default-color);">
                        This will permanently delete your account and all saved Kanji. This action cannot be undone.
                    </p>
                    
                    <!--Error message - hidden by default-->
                    <p id="delete-error" class="text-error" style="display: none"></p>

                    <button id="delete-confirm-btn" class="btn-00" style="width: 100%">
                        Confirm Delete
                    </button>
                    <button id="delete-back-btn" class="btn-01" style="width: 100%">
                        Back
                    </Button>
                </div>
            </div>

        </div>
        <!--- TAB: SETTINGS-------------------------------------->
        <div id="tab-settings" class="tab-panel" style="display: none">
            <div id="settings-screen-main" class="tab-screen">

                <h2>Settings</h2>
                <div id="settings-content" class="box-01">
                    <!-- Palette switcher --->
                    <div id="settings-palette" class="settings-item">
                        <h3>Color Palette</h3>
                        <div style="display: flex; gap: 8px;">
                            <button id="palette-dark" class="btn-02">Dark</button>
                            <button id="palette-light" class="btn-02">Light</button>
                        </div>
                    </div>
                </div>

            </div>
        </div>

    </div>
</body>
</html>
