<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../shared/styles.css">
    <script src="../shared/constants.js" defer></script>
    <script src="../shared/styles.js" defer></script>
    <script src="icon_popup.js" defer></script>
</head>
<body class="theme-default" style="width: 270px; margin: 0; background-color: var(--bg-idle-01)">
    <div class="title-text-gradient", style="
        border-bottom: 1px solid rgba(255 255 255 / 22%);
        padding: 16px;">
        漢字
    </div>
    <div class="box-00">
        <button id="icon_popup_collection_btn" 
            class="btn-00"
            style="width: 100%">
            Open Kanji Collection
        </button>
        <button id="icon_popup_settings_btn" 
            class="btn-01" >
            Settings
        </button>
        <div id="settings_drawer" class="box-01" style="
            display: none;
            flex-direction: column;
            gap: 8px;
            padding: 8px;
            overflow: hidden; 
            transition: max-height 0.25s ease;
        ">
            <p style="margin: 0px; font-weight: bold; font-size: 1rem;">Color Palette</p>
            <div id="settings-palette-section" style="display: flex; gap: 8px">
                <button id="palette-dark" class="btn-02">
                    Dark
                </button>
                <button id="palette-light" class="btn-02">
                    Light
                </button>
            </div>
        </div>
        <button id="icon_popup_exit_btn" 
            class="btn-01">
            Exit
        </button>
    </div> 
    <div class="icon_popup_footer" style="
        border-top: 1px solid rgba(255 255 255 / 22%);
        color: rgba(255 255 255 / 35%);
        padding: 8px 16px;
        display: flex;
        justify-content: center;
        align-items: center;
    ">
        <b id="app_version_text"></b>
    </div>
</body>
</html>
