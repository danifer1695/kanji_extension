<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../styles/styles.css">
    <link rel="stylesheet" href="../styles/icon_popup.css">
    <script src="../shared/constants.js" defer></script>
    <script src="../shared/styles.js" defer></script>
    <script src="../shared/api.js" defer></script>
    <script src="../shared/window_manager.js" defer></script>
    <script src="icon_popup.js" defer></script>
</head>
<body class="theme-default" style="width: 270px; margin: 0; background-color: var(--bg-idle-01)">
    <!---LOGIN SCREEN-->
    <div id="screen-login" style="display: none">
        <div class="title-text-gradient", style="
                    border-bottom: 2px solid rgba(255 255 255 / 22%);
                    padding: 16px;">
            調べよう
        </div>
        <div class="box-00">
            <input id="login-email" class="box-search-01" type="email" placeholder="Email">
            <input id="login-password" class="box-search-01" type="password" placeholder="Password">

            <!--Hidden display for auth errors. Content to be set through script-->
            <p id="login-auth-error" class="text-error"></p>
            <!-------------------------------------------------------------------->

            <button id="login-btn-login" class="btn-00" style="width: 100%; margin-top: 16px;">
                Log In
            </button>
            <button id="login-btn-register" class="btn-00" style="width: 100%">
                Register
            </button>
        </div>
        <div class="icon-popup-footer">
            <b class="app-version-text"></b>
        </div>
    </div>

    <!---MAIN SCREEN-->
    <div id="screen-main" style="display: none">
        <div class="title-text-gradient", style="
                    border-bottom: 2px solid var(--border-box);
                    padding: 16px;">
            調べよう
        </div>
        <div class="box-00">
            <button id="icon_popup_collection_btn" 
                    class="btn-00"
                    style="width: 100%">
                Open Kanji Collection
            </button>
            <button id="icon_popup_settings_btn" 
                    class="btn-01" >
                    Settings
            </button>
                <div id="settings_drawer" class="box-02" style="
                         display: none;
                         transition: max-height 0.25s ease;
                         ">
                    <p class="settings-item">Color Palette</p>
                    <div id="settings-palette-section" style="display: flex; gap: 8px">
                        <button id="palette-dark" class="btn-02">
                            Dark
                        </button>
                        <button id="palette-light" class="btn-02">
                            Light
                        </button>
                    </div>
                </div>
                <button id="icon-popup-btn-logout" class="btn-01">
                    Log Out
                </button>
        </div> 
        <div class="icon-popup-footer">
            <b class="app-version-text"></b>
        </div>
    </div>
</body>
</html>
